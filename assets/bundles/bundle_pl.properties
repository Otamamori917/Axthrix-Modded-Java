item.aj-copper-coil.description =Używana do drukowania
item.aj-lead-coil.name =Ołowiana cewka
item.aj-lead-coil.description =Używana do drukowania

item.aj-fossilized-ikatusa.name =Skamieniała Ikatusa
item.aj-fossilized-ikatusa.description =Stary metal, trochę żywy
item.aj-fossilized-ikatusa.details =[stat]Trochę żywy, stary metal znaleziony pod ziemią.\nMożna poddać rezyklingowi w celu uzyskania Komainy i Esperylu lub refinacji w celu uzyskania materiałów Ikatusowych[]\n\n"Nie obudźcie metalu"\n\n- Tablica informacyjna
item.aj-ingot.name =Sztaba
item.aj-ingot.description =Sztaba z różnych materiałów. Wymaga refinacji.

