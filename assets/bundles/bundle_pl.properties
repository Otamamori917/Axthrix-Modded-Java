block.aj-apexus.description =Zaprojektowany przez Akstryks Apeksus to ogromna wyrzutnia ładunku.\nIstnieje wiele typów amunicji, jakiej można w tym użyć, aby niszczyć wrogów, ta przerażająca broń strzela pociskami szerokości jednego metra.\nPrecyzyjne rzemiosło Akstryksu błyszczy w każdym elemencie Apeksusa.


block.aj-asmot.name =Azmot
block.aj-asmot.description =Krótkodystansowy karabin maszynowy.\nDobry przeciwko nieruchomym oraz szybko się przemieszczającym celom.\nProjekt zakłada wysoki rozrzut oraz duże zużycie amunicji.\n[stat]Rekomendowane użycie dodatkowych kontenerów.
block.aj-rektios.name =Rektioza
block.aj-rektios.description =Średniodystansowe działo soniczne.\nUszkadza cel w sposób nienaprawialny konwencjonalnymi metodami/\nZaprojektowany do zadawania niewielkich uszkodzeń standardowych.\n[stat]Rekomendowany zewnętrzy przyspieszacz.
